name: Deploy MERN App to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mern-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify frontend build
        run: |
          test -f frontend/dist/index.html
          test -d frontend/dist/assets

      - name: Prepare frontend directory on droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_PORT }}
          script: |
            set -euo pipefail

            mkdir -p /var/www/html
            rm -rf /var/www/html/*

      - name: Deploy frontend build to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_PORT }}
          source: "frontend/dist/*"
          target: "/var/www/html"
          strip_components: 2
          overwrite: true

      - name: Prepare backend directory on droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_PORT }}
          script: |
            set -euo pipefail

            mkdir -p /var/calorificServer
            cd /var/calorificServer

            # Preserve production-only data. The .env file remains on the
            # droplet and is never copied from GitHub.
            for item in * .*; do
              case "$item" in
                "."|".."|".env"|"logs"|"uploads")
                  ;;
                *)
                  rm -rf -- "$item"
                  ;;
              esac
            done

      - name: Deploy backend files to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_PORT }}
          source: "backend/*"
          target: "/var/calorificServer"
          strip_components: 1
          overwrite: true

      - name: Install, restart, and verify application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_PORT }}
          script: |
            set -euo pipefail

            FRONTEND_DIR=/var/www/html
            BACKEND_DIR=/var/calorificServer
            APP_NAME=calorific-backend

            echo "Verifying deployed frontend..."
            test -f "$FRONTEND_DIR/index.html"
            test -d "$FRONTEND_DIR/assets"

            echo "Verifying production environment file..."
            if [ ! -s "$BACKEND_DIR/.env" ]; then
              echo "ERROR: Missing or empty $BACKEND_DIR/.env"
              exit 1
            fi

            cd "$BACKEND_DIR"

            echo "Installing exact production dependencies..."
            npm ci --omit=dev

            echo "Checking required environment variables..."
            node - <<'NODE'
            require('dotenv').config();

            const required = [
              'MONGO_URI',
              'JWT_SECRET',
              'SENDGRID_API_KEY',
              'SENDGRID_FROM_EMAIL',
              'CLIENT_URL',
              'FDC_API_KEY',
              'PORT'
            ];

            const missing = required.filter((name) => !process.env[name]);

            if (missing.length > 0) {
              console.error(`Missing required environment variables: ${missing.join(', ')}`);
              process.exit(1);
            }

            console.log('Required environment variables are present.');
            NODE

            echo "Installing PM2 if needed..."
            if ! command -v pm2 >/dev/null 2>&1; then
              npm install --global pm2
            fi

            echo "Starting or restarting backend..."
            if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
              pm2 restart "$APP_NAME" --update-env
            else
              pm2 start server.js --name "$APP_NAME"
            fi

            pm2 save

            echo "Waiting for backend health endpoint..."
            curl --fail --silent --show-error \
              --retry 10 --retry-delay 2 --retry-connrefused \
              http://127.0.0.1:5000/api/health

            echo "Testing Nginx configuration..."
            nginx -t

            echo "Reloading Nginx..."
            systemctl reload nginx

            echo "Verifying frontend through Nginx..."
            curl --fail --silent --show-error \
              --retry 5 --retry-delay 2 \
              -H "Host: contactmanager24.xyz" \
              http://127.0.0.1/ >/dev/null

            echo "Verifying API through Nginx..."
            curl --fail --silent --show-error \
              --retry 5 --retry-delay 2 \
              -H "Host: contactmanager24.xyz" \
              http://127.0.0.1/api/health

            echo "Deployment completed successfully."
