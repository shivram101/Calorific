name: calorific
description: Calorific - Nutrition tracking mobile app (COP 4331 Large Project)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # HTTP requests to the Express API
  http: ^1.2.0
  # JWT storage (equivalent of AsyncStorage)
  shared_preferences: ^2.2.0
  # Barcode scanning (equivalent of expo-camera)
  mobile_scanner: ^5.1.1
  # Charts for the trends screen
  fl_chart: ^0.68.0
  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
